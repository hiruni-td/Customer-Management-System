<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app"></div>

     <aside class="sidebar" id="sidebar">
        <div class="brand">
            <span class="brand-logo">C</span>
            <span class="brand-name">Customer Manager</span>
        </div>
        <nav class="nav">
            <button class="nav-link active" data-page="dashboard">📊 Dashboard</button>
            <button class="nav-link" data-page="customers">👥 All Customers</button>
            <button class="nav-link" data-page="form">➕ Add Customer</button>
            <button class="nav-link" data-page="settings">⚙️ Settings</button>
        </nav>
    </aside>
    <div class="overlay" id="overlay"></div>

     <div class="main">

        <header class="topbar">
            <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu">☰</button>
            <h1 id="page-title">Dashboard</h1>
            <button class="icon-btn" id="theme-toggle" aria-label="Switch light or dark mode">🌙</button>
        </header>

        <main class="content">


            <section class="page active" id="page-dashboard">
                <div class="stats">
                    <div class="card stat">
                        <span class="stat-icon blue">👥</span>
                        <div><p>Total customers</p><strong id="stat-total">0</strong></div>
                    </div>
                    <div class="card stat">
                        <span class="stat-icon green">✅</span>
                        <div><p>Active customers</p><strong id="stat-active">0</strong></div>
                    </div>
                    <div class="card stat">
                        <span class="stat-icon grey">⏸️</span>
                        <div><p>Inactive customers</p><strong id="stat-inactive">0</strong></div>
                    </div>
                </div>

                <div class="card">
                    <h2>Recently added</h2>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr><th>Customer</th><th>Company</th><th>Status</th><th>Date added</th></tr>
                            </thead>
                            <tbody id="recent-body"></tbody>
                        </table>
                    </div>
                    <p class="empty-note" id="recent-empty" hidden>No customers yet. Add your first customer to see them here.</p>
                </div>
            </section>
